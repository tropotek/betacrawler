name: docs

# Deploys only ever run from main: a Pages deployment created from a tag ref
# reports success but is never promoted to the live site. The release workflow
# dispatches this one after tagging, and the build below picks the tag up.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install -r tools/requirements.txt

      # The published docs and configurator come from the newest release tag, so
      # merging to main publishes nothing. Falls back to main when no tag exists.
      - id: release
        run: |
          ref="$(git tag --list '[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)"
          echo "ref=${ref:-origin/main}" >> "$GITHUB_OUTPUT"
          echo "Release site builds from ${ref:-origin/main}"
      - run: git checkout --force '${{ steps.release.outputs.ref }}'
      - run: mkdocs build --strict
      # The configurator is a static site with no build step, so it ships as-is.
      - run: cp -r web-app site/app

      # /app-dev/ tracks main, for testing a merge against hardware before tagging.
      - run: git checkout --force origin/main
      - run: cp -r web-app site/app-dev

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
