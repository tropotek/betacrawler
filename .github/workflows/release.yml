name: release

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The tag's own CHANGELOG section becomes the release notes.
      - run: |
          awk -v heading="## $GITHUB_REF_NAME" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md

      # Every board builds the same filename, and release assets share one
      # namespace, so each image is qualified by its board before upload.
      - run: |
          mkdir -p dist
          for bin in web-app/firmware/*/*.bin; do
            board="$(basename "$(dirname "$bin")")"
            cp "$bin" "dist/$(basename "$bin" .bin)-$board.bin"
          done
          ls -l dist

      - run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md \
            || gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
          gh release upload "$GITHUB_REF_NAME" dist/*.bin --clobber
        env:
          GH_TOKEN: ${{ github.token }}
