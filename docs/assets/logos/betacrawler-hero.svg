    <path d="M40 0V500M80 0V500M120 0V500M160 0V500M200 0V500M240 0V500M280 0V500M320 0V500M360 0V500M400 0V500M440 0V500M480 0V500M520 0V500M560 0V500M600 0V500M640 0V500M680 0V500M720 0V500M760 0V500M800 0V500M840 0V500M880 0V500M920 0V500M960 0V500M1000 0V500M1040 0V500M1080 0V500M1120 0V500M1160 0V500"/>
