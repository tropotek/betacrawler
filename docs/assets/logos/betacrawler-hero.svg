<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img"
     aria-label="BetaCrawler: a circular badge split between tracked running gear and a road wheel, beside the wordmark and a strip showing both drive modes in line art with the board pins that carry them">
  <defs>
    <!-- Archivo Narrow 700 and IBM Plex Mono 500, subset to the glyphs used here and
         embedded, so the wordmark renders identically wherever this file is opened. -->
    <style>
      @font-face { font-family: "BC Display"; font-weight: 700; font-display: block;
        src: url(data:font/woff2;base64,) format("woff2"); }
      @font-face { font-family: "BC Mono"; font-weight: 500; font-display: block;
        src: url(data:font/woff2;base64,) format("woff2"); }
      .wm { font-family: "BC Display", "Archivo Narrow", "Arial Narrow", sans-serif; font-weight: 700; }
      .mn { font-family: "BC Mono", "IBM Plex Mono", ui-monospace, monospace; font-weight: 500; }
    </style>
  </defs>

  <rect width="1200" height="500" fill="#12161c"/>
  <g stroke="#e8edf4" stroke-width="1" opacity="0.05">
