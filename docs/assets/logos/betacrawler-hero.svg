    </g>
    <g stroke="#b5652f" stroke-width="1.6" fill="none"><path d="M332 82v14h-20"/><path d="M404 62v34h24"/></g>
    <g fill="#b5652f"><circle cx="332" cy="82" r="3"/><circle cx="404" cy="62" r="3"/></g>
    <g class="mn" font-size="11" fill="#e08a4d">
