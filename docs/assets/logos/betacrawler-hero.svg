  <circle cx="62" cy="26" r="62" fill="none" stroke="#39434f" stroke-width="9"/>
  <circle cx="62" cy="26" r="41" fill="#2b3440"/>
  <circle cx="62" cy="26" r="33" fill="#b5652f"/>
  <circle cx="62" cy="26" r="12" fill="#12161c"/>
  <circle cx="79.0" cy="26.0" r="4.6" fill="#12161c"/><circle cx="67.3" cy="42.2" r="4.6" fill="#12161c"/><circle cx="48.2" cy="36.0" r="4.6" fill="#12161c"/><circle cx="48.2" cy="16.0" r="4.6" fill="#12161c"/><circle cx="67.3" cy="9.8" r="4.6" fill="#12161c"/>

