  <path d="M-110 34a22 22 0 0 1 22-22h76v44h-76a22 22 0 0 1-22-22z" fill="#3a6f2d"/>
  <g fill="#a8c99b"><circle cx="-86" cy="34" r="10.5"/><circle cx="-50" cy="34" r="8"/><circle cx="-16" cy="34" r="8"/></g>
