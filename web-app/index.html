<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>betacrawler configurator</title>
  <link rel="icon" href="favicon.ico">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="vendor/bootstrap.min.css">
  <style>
    /* Adapted from Bootstrap's Dashboard example (getbootstrap.com/docs/5.3/examples/dashboard/) */
    .bi { display: inline-block; width: 1rem; height: 1rem; vertical-align: -0.125em; fill: currentColor; }
    .sidebar .nav-link { font-size: .875rem; font-weight: 500; color: var(--bs-body-color); }
    .sidebar .nav-link.active { color: #2470dc; }
    /* Bootstrap's own .nav-link.disabled color rule loses to the override
       above -- same specificity, but this block comes later in the cascade
       -- so the disabled state needs its own explicit rule here instead. */
    .sidebar .nav-link.disabled { color: var(--bs-secondary-color); }
    .navbar-brand { padding-top: .75rem; padding-bottom: .75rem; }
    /* Bootstrap's width utilities (unlike margin/display) have no responsive
       breakpoint variants in the default build -- "w-md-auto" isn't a real
       class, so this override has to be a real media query instead. */
    #connection-controls { width: 100%; }
    @media (min-width: 768px) {
      #connection-controls { width: auto; }
    }
    /* Three buttons share the terminal's command row; on a phone they squeeze
       the input down to a couple of characters. Giving the input a real flex
       basis makes it wrap onto its own line instead of collapsing. */
    #term-command-row { flex-wrap: wrap; }
    #term-input { flex: 1 1 14rem; }

    /* Hardware wiring diagrams (Examples page). The format: the STM board
       shows its own pin names inside its own border, each module card shows
       only that module's own pin names inside its border, every wire is
       color-coded per module and ends in a solid connector dot at both the
       board and the module, and each card gets a rule under its header and
       another above its footnote. Reuse this pattern for future diagrams
       rather than re-deriving a layout. */
    .wiring-diagram {
      --wd-copper: #b5652f;
      --wd-receiver: #7358b8;
      --wd-esc: #4c8c3c;
      --wd-motor: #2b4a8c;
      --wd-pdb: #14707f;
      --wd-vbat: #a8377a;
      --wd-power: #c23f34;
      --wd-ink: #161b22;
      --wd-muted: #5b6673;
      --wd-surface: #fff;
      --wd-surface-2: #f5f7fa;
      --wd-border: rgba(22, 27, 34, 0.14);
      --wd-font-heading: "Archivo Narrow", "Roboto Condensed", "Arial Narrow", sans-serif;
      --wd-font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    }
    .wiring-diagram .diagram-card {
      background: var(--wd-surface-2);
      border: 1px solid var(--wd-border);
      border-radius: .5rem;
      padding: .5rem;
      overflow-x: auto;
    }
    .wiring-diagram svg { display: block; width: 100%; height: auto; min-width: 720px; }
    .wiring-diagram .lbl-mono { font-family: var(--wd-font-mono); }
    .wiring-diagram .lbl-heading { font-family: var(--wd-font-heading); font-weight: 700; }
    .wiring-diagram .fill-ink { fill: var(--wd-ink); }
    .wiring-diagram .fill-muted { fill: var(--wd-muted); }
    .wiring-diagram .fill-copper { fill: var(--wd-copper); }
    .wiring-diagram .fill-receiver { fill: var(--wd-receiver); }
    .wiring-diagram .fill-esc { fill: var(--wd-esc); }
    .wiring-diagram .fill-motor { fill: var(--wd-motor); }
    .wiring-diagram .fill-pdb { fill: var(--wd-pdb); }
    .wiring-diagram .fill-vbat { fill: var(--wd-vbat); }
    .wiring-diagram .fill-power { fill: var(--wd-power); }
    .wiring-diagram .fill-surface { fill: var(--wd-surface); }
    .wiring-diagram .fill-surface2 { fill: var(--wd-surface-2); }
    .wiring-diagram .stroke-border { stroke: var(--wd-border); }
    .wiring-diagram .wire-receiver { stroke: var(--wd-receiver); stroke-width: 1.75; fill: none; }
    .wiring-diagram .wire-esc { stroke: var(--wd-esc); stroke-width: 1.75; fill: none; }
    .wiring-diagram .wire-motor { stroke: var(--wd-motor); stroke-width: 1.75; fill: none; }
    .wiring-diagram .wire-pdb { stroke: var(--wd-pdb); stroke-width: 2.25; fill: none; }
    .wiring-diagram .wire-vbat { stroke: var(--wd-vbat); stroke-width: 1.75; fill: none; }
    .wiring-diagram .wire-copper { stroke: var(--wd-copper); stroke-width: 1.75; fill: none; }
    .wiring-diagram .wire-reserved { stroke-dasharray: 3 3; opacity: 0.55; }

    /* Home page hero: a hand-drawn comic/arcade-poster illustration
       (app/web/tank-hero.svg). object-fit:contain (not cover) so nothing is
       ever cropped off the top/bottom on wide screens, where the main
       column can get much wider than the artwork's own 1200x500 aspect
       ratio -- the background color matches the SVG's own so letterboxing
       on ultra-wide screens is invisible instead of showing bars. */
    .tank-hero { height: 340px; overflow: hidden; border-radius: .5rem; margin-bottom: 1rem; background: #13230f; }
    .tank-hero img { width: 100%; height: 100%; object-fit: contain; display: block; }

    /* Modes page: one row per function -- a name plate, its channel select,
       then the slider. Rows sit in a single panel, split only by margin. */
    .mode-row + .mode-row { margin-top: 1.75rem; }
    .mode-name {
      flex: 0 0 11rem; padding: .5rem;
      border: 1px solid var(--bs-border-color); border-radius: .375rem;
      background: var(--bs-tertiary-bg);
    }
    .mode-title {
      font-size: .8125rem; font-weight: 700; text-align: center;
      letter-spacing: .04em; text-transform: uppercase;
    }
    .mode-channel { flex: 0 0 8rem; }

    /* Dual-handle range slider (the `rangeSlider` Alpine component). Built
       from plain elements rather than native range inputs, whose track can
       only be reached through vendor pseudo-elements -- --range-accent colors
       the fill and both handles as one. The side padding is what lets the end
       labels centre on their own ticks rather than tuck inside the track. */
    .range-slider { --range-accent: #0d6efd; min-width: 0; padding: 0 1.5rem; }
    .range-slider-disabled { --range-accent: var(--bs-secondary-color); }
    .range-track {
      position: relative; height: .5rem; margin-top: .75rem;
      background: var(--bs-secondary-bg); border-radius: 1rem;
    }
    .range-fill {
      position: absolute; top: 0; height: 100%;
      background: var(--range-accent); border-radius: 1rem;
    }
    .range-thumb {
      position: absolute; top: 50%; width: 1.25rem; height: 1.25rem;
      margin: -.625rem 0 0 -.625rem; background: var(--bs-body-bg);
      border: 3px solid var(--range-accent); border-radius: 50%;
      cursor: grab; touch-action: none;
    }
    .range-thumb:active { cursor: grabbing; }
    .range-thumb:focus-visible { outline: 0; box-shadow: 0 0 0 .25rem rgba(13, 110, 253, .25); }
    .range-slider-disabled .range-thumb { cursor: default; }

    /* Ruler under the track: a tick every tenth, each labelled, with the ends
       and midpoint drawn taller. Labels centre on their own tick. */
    .range-ruler { position: relative; height: 1.75rem; margin-top: .5rem; }
    .range-tick { position: absolute; top: 0; width: 1px; height: .3125rem; background: var(--bs-border-color); }
    .range-tick-major { height: .5rem; }
    .range-tick span {
      position: absolute; top: .625rem; left: 50%; transform: translateX(-50%);
      font-size: .6875rem; color: var(--bs-secondary-color);
    }

    /* Live RC position for this function's channel, sitting on the ruler.
       Keeps its own color so it stays readable on a row with no range. */
    .range-live {
      position: absolute; top: -.1875rem; width: .3125rem; height: .875rem;
      margin-left: -.15625rem; border-radius: .1875rem;
      background: #0d6efd;
    }
    .range-slider-disabled .range-live { background: var(--bs-secondary-color); }

    /* Controller page's RC Channel bars: a lighter blue than Bootstrap's
       default .progress-bar so the centered bold-black value stays legible
       against the fill, not just the empty track. */
    .ch-bar { background-color: #6ea8fe; }
  </style>
</head>

  <header class="navbar navbar-dark sticky-top bg-dark p-0 shadow">
    <div class="container-fluid flex-wrap gap-2 py-2">
      <a href="#" class="navbar-brand me-0 px-3 flex-shrink-0" data-page="home">
        betacrawler
        <!-- The APP's version (this UI + the Python backend), filled in from
             APP_VERSION in app.js. The FIRMWARE's version is separate and
             appears in #fw once connected. -->
        <span id="app-version" class="fs-6 fw-normal text-secondary"></span>
      </a>

      <button class="navbar-toggler ms-auto flex-shrink-0 d-md-none" type="button" data-bs-toggle="offcanvas"
              data-bs-target="#sidebarMenu" aria-controls="sidebarMenu" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- One flex item, so it wraps to its own row as a unit on narrow
           screens instead of each control wrapping independently. Width is
           set via the #connection-controls media query above, not a
           w-md-auto utility class (doesn't exist -- see that comment). -->
      <div id="connection-controls" class="d-flex align-items-center gap-2 flex-wrap ms-md-auto">
        <span id="fw" class="text-secondary small d-none d-md-inline"></span>
        <span id="state" class="badge text-bg-secondary">disconnected</span>
        <button id="connect" class="btn btn-sm btn-primary">Connect</button>
      </div>
    </div>
  </header>

  <div class="container-fluid">
    <div class="row">
      <div class="sidebar border-end col-md-3 col-lg-2 p-0 bg-body-tertiary">
        <div class="offcanvas-md offcanvas-start bg-body-tertiary" tabindex="-1" id="sidebarMenu"
             aria-labelledby="sidebarMenuLabel">
          <div class="offcanvas-header">
            <h5 class="offcanvas-title" id="sidebarMenuLabel">betacrawler</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas"
                    data-bs-target="#sidebarMenu" aria-label="Close"></button>
          </div>
          <div class="offcanvas-body d-md-flex flex-column p-0 pt-lg-3 overflow-y-auto">
            <ul class="nav flex-column">
              <li class="nav-item">
                <button class="nav-link d-flex align-items-center gap-2 active" data-page="home"
                        aria-current="page">
                  <svg class="bi"><use href="#house-fill"/></svg>
                  Home
                </button>
              </li>
              <li class="nav-item">
                <button class="nav-link d-flex align-items-center gap-2" data-page="config">
                  <svg class="bi"><use href="#cpu"/></svg>
                  Configuration
                </button>
              </li>
              <li class="nav-item">
                <button class="nav-link d-flex align-items-center gap-2" data-page="controller">
                  <svg class="bi"><use href="#gear-wide-connected"/></svg>
                  Controller
                </button>
              </li>
              <li class="nav-item">
                <button class="nav-link d-flex align-items-center gap-2" data-page="modes">
                  <svg class="bi"><use href="#sliders"/></svg>
                  Modes
                </button>
              </li>
              <li class="nav-item">
                <button class="nav-link d-flex align-items-center gap-2" data-page="terminal">
                  <svg class="bi"><use href="#terminal-fill"/></svg>
                  Terminal
                </button>
              </li>
            </ul>
            <hr class="my-3">
            <ul class="nav flex-column mb-auto">
              <li class="nav-item">
                <button class="nav-link d-flex align-items-center gap-2" data-page="wiring">
                  <svg class="bi"><use href="#image-fill"/></svg>
                  Wiring
                </button>
              </li>
              <li class="nav-item">
                <button class="nav-link d-flex align-items-center gap-2" data-page="help">
                  <svg class="bi"><use href="#question-circle"/></svg>
                  Help
                </button>
              </li>
            </ul>
          </div>
        </div>
      </div>

      <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
        <div id="alert" class="alert alert-danger d-none mt-3" role="alert"></div>

        <div id="save-bar" class="d-flex gap-2 align-items-center mt-3" x-show="$store.app.connected" x-data>
          <button id="save" class="btn btn-success btn-sm">Save to flash</button>
          <button id="revert" class="btn btn-outline-secondary btn-sm">Discard changes</button>
          <button id="defaults" class="btn btn-outline-secondary btn-sm">Load defaults</button>
          <span class="text-warning-emphasis small" x-show="$store.app.dirty">applied — not saved to flash</span>
          <span class="text-warning-emphasis small" x-show="$store.app.revertNote">no saved settings on this board — loaded defaults instead</span>
        </div>

        <div id="page-mount" x-data></div>
      </main>
    </div>
  </div>

  <script src="vendor/bootstrap.bundle.min.js"></script>
  <!-- A module script executes deferred, same as Alpine's own defer tag below --
       both run in document order once parsing finishes. app.js's
       document.addEventListener('alpine:init', ...) has to be registered
       before Alpine's script runs Alpine.start(), so this tag stays first. -->
  <script type="module" src="js/app.js"></script>
  <script defer src="vendor/alpine.min.js"></script> <!-- Alpine.js v3.15.12, MIT, alpinejs.dev -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('service-worker.js'));
    }
  </script>
</body>
</html>
