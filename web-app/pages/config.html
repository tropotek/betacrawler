          <div class="d-flex justify-content-between flex-wrap align-items-center pt-3 pb-2 mb-3 border-bottom">
            <h1 class="h2">Configuration</h1>
          </div>
          <div class="card mb-3" x-data>
            <div class="card-header h6 text-secondary mb-0 py-2">System</div>
            <div class="card-body row g-3">
              <template x-for="key in ['clk', 'ram', 'temp', 'vdd', 'loop', 'loopworst', 'up']
                                 .filter((k) => $store.telemetry.field(k).def)" :key="key">
                <div class="col-6 col-md-4">
                  <div class="text-secondary small" x-text="tlmLabel(key)"></div>
                  <div class="fs-4" x-text="$store.telemetry.field(key).value ?? '–'"></div>
                </div>
              </template>
              <template x-if="$store.telemetry.field('fault').def">
                <div class="col-6 col-md-4">
                  <div class="text-secondary small"
                       x-text="$store.telemetry.field('fault').def.label"></div>
                  <div class="fs-4"
                       :class="faultIsError($store.telemetry.field('fault').value) ? 'text-danger' : ''"
                       x-text="faultText($store.telemetry.field('fault').value)"></div>
                </div>
              </template>
            </div>
          </div>
          <template x-if="$store.telemetry.field('vbat').def">
            <div class="card mb-3" x-data>
              <div class="card-header h6 text-secondary mb-0 py-2">Battery</div>
              <div class="card-body row g-3" x-show="$store.telemetry.raw['cells']">
                <div class="col-6 col-md-3">
                  <div class="text-secondary small">Pack (V)</div>
                  <div class="fs-4" x-text="$store.telemetry.field('vbat').value ?? '–'"></div>
                </div>
                <div class="col-6 col-md-3">
                  <div class="text-secondary small">Per cell (V)</div>
                  <div class="fs-4" x-text="perCellText()"></div>
                </div>
                <template x-if="$store.telemetry.field('pct').def">
                  <div class="col-6 col-md-3">
                    <div class="text-secondary small" x-text="tlmLabel('pct')"></div>
                    <div class="fs-4" x-text="$store.telemetry.field('pct').value ?? '–'"></div>
                  </div>
                </template>
                <template x-if="$store.telemetry.field('cells').def">
                  <div class="col-6 col-md-3">
                    <div class="text-secondary small" x-text="tlmLabel('cells')"></div>
                    <div class="fs-4" x-text="$store.telemetry.field('cells').value ?? '–'"></div>
                  </div>
                </template>
              </div>
              <div class="card-body" x-show="!$store.telemetry.raw['cells']">
                <div class="fs-5 text-secondary">No pack connected</div>
                <div class="small text-secondary">
                  Sense input reads
                  <span class="font-monospace" x-text="$store.telemetry.field('vbat').value ?? '–'"></span> V.
                  A board powered over USB sits a few volts here from the BEC, with no pack present.
                </div>
              </div>
            </div>
          </template>
          <fieldset class="card mb-3" :disabled="!$store.app.connected" x-data>
            <legend class="card-header h6 text-secondary mb-0 py-2">Identity</legend>
            <div class="card-body row g-3">
              <div class="col-md-6">
                <label class="form-label" for="f-device-name">Device Name</label>
                <input type="text" class="form-control" id="f-device-name"
                       :maxlength="$store.config.field('device.name').def?.maxlen"
                       :class="{ 'is-invalid': $store.config.invalid['device.name'] }"
                       x-model="$store.config.values['device.name']"
                       @change="$store.config.commit($store.config.field('device.name').def)">
              </div>
            </div>
          </fieldset>
          <template x-if="$store.config.field('drive.mode').def">
            <fieldset class="card mb-3" :disabled="!$store.app.connected" x-data>
              <legend class="card-header h6 text-secondary mb-0 py-2">Drive</legend>
              <div class="card-body row g-3">
                <div class="col-md-6">
                  <div class="d-flex align-items-center mb-2">
                    <label class="form-label mb-0" for="f-drive-mode">Drive Mode</label>
                    <span class="help-icon" tabindex="0" role="button"><svg class="bi" aria-hidden="true"><use href="#question-circle-fill"/></svg></span>
                  </div>
                  <select class="form-select" id="f-drive-mode"
                          :class="{ 'is-invalid': $store.config.invalid['drive.mode'] }"
                          x-model="$store.config.values['drive.mode']"
                          @change="$store.config.setDriveMode($event.target.value)">
                    <template x-for="opt in $store.config.field('drive.mode').def?.options ?? []" :key="opt">
                      <option :value="opt" :selected="opt === $store.config.values['drive.mode']" x-text="opt"></option>
                    </template>
                  </select>
                  <div class="help-body d-none">
                    <strong>skid</strong> mixes throttle and steer into a left and a right output —
                    tracks, or a wheeled rover that turns by driving its sides at different speeds.
                    <strong>car</strong> sends throttle to both motor outputs and steer to the
                    servo on PB10, which the firmware drives whenever Drive Mode is car.
                  </div>
                </div>
              </div>
            </fieldset>
          </template>

          <template x-if="$store.config.field('servo.invert').def
                           && $store.config.values['drive.mode'] === 'car'">
            <fieldset class="card mb-3" :disabled="!$store.app.connected" x-data>
              <legend class="card-header h6 text-secondary mb-0 py-2">Steering Servo</legend>
              <div class="card-body row g-3">
                <div class="col-md-6">
                  <div class="d-flex align-items-center mb-2">
                    <label class="form-label mb-0" for="f-servo-invert">Invert</label>
                    <span class="help-icon" tabindex="0" role="button"><svg class="bi" aria-hidden="true"><use href="#question-circle-fill"/></svg></span>
                  </div>
                  <select class="form-select" id="f-servo-invert"
                          :class="{ 'is-invalid': $store.config.invalid['servo.invert'] }"
                          x-model="$store.config.values['servo.invert']"
                          @change="$store.config.commit($store.config.field('servo.invert').def)">
                    <template x-for="opt in $store.config.field('servo.invert').def?.options ?? []" :key="opt">
                      <option :value="opt" :selected="opt === $store.config.values['servo.invert']" x-text="opt"></option>
                    </template>
                  </select>
                  <div class="help-body d-none">
                    Set this to <strong>reversed</strong> if the wheels turn the wrong way. Which
                    way round the servo horn went on is a coin flip.
                  </div>
                </div>
                <template x-if="$store.config.field('servo.trim_us').def">
                  <div class="col-md-6">
                    <div class="d-flex align-items-center mb-2">
                      <label class="form-label mb-0" for="f-servo-trim">Trim (µs)</label>
                      <span class="help-icon" tabindex="0" role="button"><svg class="bi" aria-hidden="true"><use href="#question-circle-fill"/></svg></span>
                    </div>
                    <input type="number" class="form-control" id="f-servo-trim"
                           :min="$store.config.field('servo.trim_us').def?.min"
                           :max="$store.config.field('servo.trim_us').def?.max"
                           :class="{ 'is-invalid': $store.config.invalid['servo.trim_us'] }"
                           x-model="$store.config.values['servo.trim_us']"
                           @change="$store.config.commit($store.config.field('servo.trim_us').def)">
                    <div class="help-body d-none">
                      Nudges the centre point so the wheels sit straight. Negative values go the
                      other way. It corrects the linkage, not the input.
                    </div>
                  </div>
                </template>
              </div>
            </fieldset>
          </template>

          <template x-if="$store.config.field('motor0.type').def">
            <fieldset class="card mb-3" :disabled="!$store.app.connected" x-data>
              <legend class="card-header h6 text-secondary mb-0 py-2"
                      x-text="{ brushed: 'Motor Output', brushless: 'ESC' }[$store.config.values['motor0.type']] ?? 'Motor'"></legend>
              <div class="card-body row g-3">
                <div class="col-md-6">
                  <div class="d-flex align-items-center mb-2">
                    <label class="form-label mb-0" for="f-esc-type">Type</label>
                    <span class="help-icon" tabindex="0" role="button"><svg class="bi" aria-hidden="true"><use href="#question-circle-fill"/></svg></span>
                  </div>
                  <select class="form-select" id="f-esc-type"
                          :class="{ 'is-invalid': $store.config.invalid['motor0.type'] || $store.config.invalid['motor1.type'] }"
                          @change="$store.config.setBothEscTypes($event.target.value)">
                    <template x-for="opt in $store.config.field('motor0.type').def?.options ?? []" :key="opt">
                      <option :value="opt" :selected="opt === $store.config.values['motor0.type']" x-text="opt"></option>
                    </template>
                  </select>
                  <div class="help-body d-none">
                    <strong>none</strong> detaches the output, so nothing is driven until you choose.
                    <strong>brushless</strong> drives a BLHeli-class ESC. <strong>brushed</strong> drives a
                    DRV8833-class H-bridge — see the Wiring page for both.
                  </div>
                </div>

                <template x-if="$store.config.values['motor0.type'] === 'brushless'">
                  <div class="col-md-6">
                    <div class="d-flex align-items-center mb-2">
                      <label class="form-label mb-0" for="f-esc-rate">PWM Rate (Hz)</label>
                      <span class="help-icon" tabindex="0" role="button"><svg class="bi" aria-hidden="true"><use href="#question-circle-fill"/></svg></span>
                    </div>
                    <select class="form-select" id="f-esc-rate"
                            :class="{ 'is-invalid': $store.config.invalid['motor0.rate'] || $store.config.invalid['motor1.rate'] }"
                            @change="$store.config.setBothEscRates($event.target.value)">
                      <template x-for="opt in $store.config.field('motor0.rate').def?.options ?? []" :key="opt">
                        <option :value="opt" :selected="opt === $store.config.values['motor0.rate']" x-text="opt"></option>
                      </template>
                    </select>
                    <div class="help-body d-none">
                      How often each ESC is sent a new command. 50 Hz is what every analog ESC
                      auto-detects; a BLHeli_S-class ESC handles 400 Hz and cuts up to 20ms of
                      stick-to-motor delay. Changing this re-runs the arm hold.
                    </div>
                  </div>
                </template>

                <template x-if="$store.config.values['motor0.type'] === 'brushed'">
                  <div class="col-md-6">
                    <div class="d-flex align-items-center mb-2">
                      <label class="form-label mb-0" for="f-esc-freq">Switch Freq (Hz)</label>
                      <span class="help-icon" tabindex="0" role="button"><svg class="bi" aria-hidden="true"><use href="#question-circle-fill"/></svg></span>
                    </div>
                    <input type="number" class="form-control" id="f-esc-freq"
                           :class="{ 'is-invalid': $store.config.invalid['motor0.freq'] || $store.config.invalid['motor1.freq'] }"
                           :min="$store.config.field('motor0.freq').def?.min" :max="$store.config.field('motor0.freq').def?.max"
                           :value="$store.config.values['motor0.freq']"
                           @change="$store.config.setBothEscFreq($event.target.value)">
                    <div class="help-body d-none">
                      PWM switching frequency into the H-bridge. 20 kHz (the default) is above the
                      audible range and every DRV8833/TB6612-class driver handles it fine.
                    </div>
                  </div>
                </template>

                <template x-if="$store.config.values['motor0.type'] === 'brushed'">
                  <div class="col-md-6">
                    <div class="d-flex align-items-center mb-2">
                      <label class="form-label mb-0" for="f-esc-brake">At Zero</label>
                      <span class="help-icon" tabindex="0" role="button"><svg class="bi" aria-hidden="true"><use href="#question-circle-fill"/></svg></span>
                    </div>
                    <select class="form-select" id="f-esc-brake"
                            :class="{ 'is-invalid': $store.config.invalid['motor0.brake'] || $store.config.invalid['motor1.brake'] }"
                            @change="$store.config.setBothEscBrake($event.target.value)">
                      <template x-for="opt in $store.config.field('motor0.brake').def?.options ?? []" :key="opt">
                        <option :value="opt" :selected="opt === $store.config.values['motor0.brake']" x-text="opt"></option>
                      </template>
                    </select>
                    <div class="help-body d-none">
                      <strong>coast</strong> lets a stopped motor spin freely. <strong>brake</strong> holds
                      both H-bridge inputs high at zero command, resisting motion.
                    </div>
                  </div>
                </template>

                <template x-if="$store.config.field('motor0.invert').def">
                  <div class="col-md-3">
                    <div class="d-flex align-items-center mb-2">
                      <label class="form-label mb-0" for="f-motor0-invert">Motor 0 Invert</label>
                      <span class="help-icon" tabindex="0" role="button"><svg class="bi" aria-hidden="true"><use href="#question-circle-fill"/></svg></span>
                    </div>
                    <select class="form-select" id="f-motor0-invert"
                            :class="{ 'is-invalid': $store.config.invalid['motor0.invert'] }"
                            x-model="$store.config.values['motor0.invert']"
                            @change="$store.config.commit($store.config.field('motor0.invert').def)">
                      <template x-for="opt in $store.config.field('motor0.invert').def?.options ?? []" :key="opt">
                        <option :value="opt" :selected="opt === $store.config.values['motor0.invert']" x-text="opt"></option>
                      </template>
                    </select>
                    <div class="help-body d-none">Reverses motor direction.</div>
                  </div>
                </template>

                <template x-if="$store.config.field('motor1.invert').def">
                  <div class="col-md-3">
                    <div class="d-flex align-items-center mb-2">
                      <label class="form-label mb-0" for="f-motor1-invert">Motor 1 Invert</label>
                      <span class="help-icon" tabindex="0" role="button"><svg class="bi" aria-hidden="true"><use href="#question-circle-fill"/></svg></span>
                    </div>
                    <select class="form-select" id="f-motor1-invert"
                            :class="{ 'is-invalid': $store.config.invalid['motor1.invert'] }"
                            x-model="$store.config.values['motor1.invert']"
                            @change="$store.config.commit($store.config.field('motor1.invert').def)">
                      <template x-for="opt in $store.config.field('motor1.invert').def?.options ?? []" :key="opt">
                        <option :value="opt" :selected="opt === $store.config.values['motor1.invert']" x-text="opt"></option>
                      </template>
                    </select>
                    <div class="help-body d-none">Reverses motor direction.</div>
                  </div>
                </template>
              </div>
            </fieldset>
          </template>
          <template x-if="$store.config.field('vbat.source').def">
            <fieldset class="card mb-3" :disabled="!$store.app.connected" x-data="{ measured: '' }">
              <legend class="card-header h6 text-secondary mb-0 py-2">Battery Sensor</legend>
              <div class="card-body row g-3">
                <div class="col-md-6">
                  <div class="d-flex align-items-center mb-2">
                    <label class="form-label mb-0" for="f-vbat-cells">Cells</label>
                    <span class="help-icon" tabindex="0" role="button"><svg class="bi" aria-hidden="true"><use href="#question-circle-fill"/></svg></span>
                  </div>
                  <select class="form-select" id="f-vbat-cells"
                          :class="{ 'is-invalid': $store.config.invalid['vbat.cells'] }"
                          x-model="$store.config.values['vbat.cells']"
                          @change="$store.config.commit($store.config.field('vbat.cells').def)">
                    <template x-for="opt in $store.config.field('vbat.cells').def?.options ?? []" :key="opt">
                      <option :value="opt" :selected="opt === $store.config.values['vbat.cells']" x-text="opt"></option>
                    </template>
                  </select>
                  <div class="help-body d-none">
                    <strong>auto</strong> latches the count from the first valid reading and
                    never revisits it. It cannot tell a part-drained 6S from a 5S, so set the
                    count explicitly if the Cells reading above is wrong.
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="d-flex align-items-center mb-2">
                    <label class="form-label mb-0" for="f-vbat-measured">Measured pack voltage (V)</label>
                    <span class="help-icon" tabindex="0" role="button"><svg class="bi" aria-hidden="true"><use href="#question-circle-fill"/></svg></span>
                  </div>
                  <div class="input-group">
                    <input type="number" step="0.01" class="form-control" id="f-vbat-measured"
                           x-model="measured" placeholder="e.g. 16.78">
                    <button class="btn btn-outline-secondary" type="button"
                            @click="$store.config.calibrateVbat(measured)">Calibrate</button>
                  </div>
                  <div class="help-body d-none">
                    Read the pack with a multimeter, enter it here, and the reading is
                    adjusted to match. Needs Source set to adc.
                    <span class="d-block mt-1">
                      Scale <span class="font-monospace" x-text="$store.config.values['vbat.scale']"></span>
                      &mdash; set by calibrating, not edited directly.
                    </span>
                  </div>
                </div>
              </div>
            </fieldset>
          </template>
          <p>&nbsp;</p>
