platform = ststm32
board = blackpill_f401ce
framework = arduino
upload_protocol = stlink
debug_tool = stlink
build_flags =
    -DUSBCON
    -DUSBD_USE_CDC
    -Wswitch
    -Iinclude
    -D FW_TARGET_ARDUINO=1
    -D BOARD_HEADER='"boards/blackpill_f401ce.h"'
    -D SERIAL_RX_BUFFER_SIZE=256
monitor_speed = 115200          ; must match FW_SERIAL_BAUD in include/config.h
; Without this, editing a board header does NOT trigger a rebuild -- see the
; docstring in scripts/config_hash.py. Do not remove it.
extra_scripts = pre:scripts/config_hash.py
lib_deps =
    bblanchon/ArduinoJson@^7.0.4
    moononournation/GFX Library for Arduino@^1.4.9

; ESP32 (esp32_wroom32) is not a supported build target at this time -- the
; env was removed here on purpose. boards/esp32_wroom32.h and
; hardware/wifi/wifi_esp32_driver.cpp are left in place (dead code, unused by
; any env) rather than deleted, so support is cheap to resurrect: look up the
; removed [env:esp32_wroom32] block in git history (it targeted the espressif32
; platform's esp32dev board, selected that board header, and needed the
; gnu++17 build_flags/build_unflags pair) and restore it verbatim; no other
; edit is needed. bundle_firmware.py's all_board_envs() needs no change
; either way: it discovers board envs structurally from platformio.ini, not
; by name, so removing the section here is sufficient on its own to drop
; ESP32 from the app's shipped firmware bundle too.
;
; NOTE FOR ANYONE EDITING THIS FILE: a comment block sitting between two
; [env:...] sections (like this one) has no header of its own, so
; bundle_firmware.py's _env_block() parser (a regex bounded by the next
; line starting with "[") silently attributes it to the PRECEDING section,
; not to whichever section it reads as "belonging to" visually. Never write
; -D KEY=VALUE-shaped example text in a dangling comment here -- it can get
; matched by method_for()'s or all_board_envs()'s regexes against the wrong
; env. This exact mistake once made blackpill_f401ce misdetected as an ESP32
; target. Keep example flags out of prose comments; point at git history
; instead, as done above.

[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu++17
    ; Same switch exhaustiveness guarantee as the board env, and it belongs
    ; here more: `pio test -e native` is the env everyone actually runs, so
    ; without this a new Op added with no case in Dispatcher::handle compiles
    ; clean and silently answers with a response missing "ok". -Werror=switch
    ; makes it a failure rather than a warning scrolled past in the log.
    -Wswitch
    -Werror=switch
    -I src
    -I include
    ; Deliberately the REAL board header, not a fake "native" one: the native
    ; suite asserts against test/golden/schema.json, and that fixture is only
    ; meaningful if it describes the parameter/telemetry set the actual device
    ; exposes. FW_TARGET_ARDUINO is left undefined, so modules.cpp registers
    ; every module's descriptor with a null driver.
    -D BOARD_HEADER='"boards/blackpill_f411ce.h"'
extra_scripts = pre:scripts/config_hash.py
lib_deps =
    bblanchon/ArduinoJson@^7.0.4
lib_compat_mode = off
test_build_src = yes
; An include-list, not an exclude-list: any future Arduino-only file stays out
; of the native build automatically, with no edit here. The entries are
; (1) the pure core, (2) the module wiring file, (3) every module's pure
; descriptor TU, and (4) pure protocol TUs split out of a descriptor that had
; grown two protocols' worth of framing -- the driver TUs (*_driver.cpp) are
; what get left behind.
build_src_filter =
    +<core/*>
    +<modules.cpp>
    +<features/*/*_params.cpp>
    +<hardware/*/*_params.cpp>
    +<features/*/proto_*.cpp>
    +<hardware/*/proto_*.cpp>
    ; esc_math.cpp holds pure functions shared by the esc0/esc1 modules, not a
    ; ModuleDesc -- it doesn't match the *_params.cpp pattern above, so it
    ; needs its own line to be part of the native build (and its own test,
    ; test_esc, which links against it).
    +<hardware/esc/esc_math.cpp>
    ; tank_drive_math.cpp holds pure functions for the tank_drive module, not
    ; a ModuleDesc -- same reasoning as esc_math.cpp just above.
    +<features/tank_drive/tank_drive_math.cpp>
    ; vbat_math.cpp holds pure functions for the vbat module, not a
    ; ModuleDesc -- same reasoning as esc_math.cpp just above.
    +<hardware/vbat/vbat_math.cpp>
