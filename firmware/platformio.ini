[env:blackpill_f411ce]
platform = ststm32
board = blackpill_f411ce
framework = arduino
upload_protocol = stlink
debug_tool = stlink
build_flags =
    -DUSBCON
    -DUSBD_USE_CDC
    -Wswitch
    -Iinclude
    ; Gates the driver half of src/modules.cpp. Set explicitly rather than
    ; sniffing the Arduino core's own ARDUINO macro, so "does this build have
    ; hardware drivers?" is answered by one self-documenting flag.
    -D FW_TARGET_ARDUINO=1
    -D BOARD_HEADER='"boards/blackpill_f411ce.h"'
monitor_speed = 115200          ; must match FW_SERIAL_BAUD in include/config.h
; Without this, editing a board header does NOT trigger a rebuild -- see the
; docstring in scripts/config_hash.py. Do not remove it.
extra_scripts = pre:scripts/config_hash.py
lib_deps =
    bblanchon/ArduinoJson@^7.0.4
    ; Board-only: the native env compiles no *_driver.cpp, so it never needs
    ; a graphics library. FEATURE_DISPLAY 0 leaves this unused but harmless.
    moononournation/GFX Library for Arduino@^1.4.9

[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu++17
    -I src
    -I include
    ; Deliberately the REAL board header, not a fake "native" one: the native
    ; suite asserts against test/golden/schema.json, and that fixture is only
    ; meaningful if it describes the parameter/telemetry set the actual device
    ; exposes. FW_TARGET_ARDUINO is left undefined, so modules.cpp registers
    ; every module's descriptor with a null driver.
    -D BOARD_HEADER='"boards/blackpill_f411ce.h"'
extra_scripts = pre:scripts/config_hash.py
lib_deps =
    bblanchon/ArduinoJson@^7.0.4
lib_compat_mode = off
test_build_src = yes
; An include-list, not an exclude-list: any future Arduino-only file stays out
; of the native build automatically, with no edit here. The three entries are
; (1) the pure core, (2) the module wiring file, and (3) every module's pure
; descriptor TU -- the driver TUs (*_driver.cpp) are what get left behind.
build_src_filter =
    +<core/*>
    +<modules.cpp>
    +<features/*/*_params.cpp>
    +<hardware/*/*_params.cpp>
