[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu++17
    ; Same switch exhaustiveness guarantee as the board env, and it belongs
    ; here more: `pio test -e native` is the env everyone actually runs, so
    ; without this a new Op added with no case in Dispatcher::handle compiles
    ; clean and silently answers with a response missing "ok". -Werror=switch
    ; makes it a failure rather than a warning scrolled past in the log.
    -Wswitch
    -Werror=switch
    -I src
    -I include
    ; Deliberately the REAL board header, not a fake "native" one: the native
    ; suite asserts against test/golden/schema.json, and that fixture is only
    ; meaningful if it describes the parameter/telemetry set the actual device
    ; exposes. FW_TARGET_ARDUINO is left undefined, so modules.cpp registers
    ; every module's descriptor with a null driver.
    -D BOARD_HEADER='"boards/blackpill_f411ce.h"'
extra_scripts = pre:scripts/config_hash.py
lib_deps =
    bblanchon/ArduinoJson@^7.0.4
lib_compat_mode = off
test_build_src = yes
; An include-list, not an exclude-list: any future Arduino-only file stays out
; of the native build automatically, with no edit here. The entries are
; (1) the pure core, (2) the module wiring file, (3) every module's pure
; descriptor TU, and (4) pure protocol TUs split out of a descriptor that had
; grown two protocols' worth of framing -- the driver TUs (*_driver.cpp) are
; what get left behind.
build_src_filter =
    +<core/*>
    +<modules.cpp>
    +<features/*/*_params.cpp>
    +<hardware/*/*_params.cpp>
    +<features/*/proto_*.cpp>
    +<hardware/*/proto_*.cpp>
