[env:esp32_wroom32]
platform = espressif32
board = esp32dev
framework = arduino
build_flags =
    ; The espressif32 platform's own default is -std=gnu++11 (unlike ststm32,
    ; which already defaults to gnu++17 -- see [env:blackpill_f411ce]). core's
    ; ParamDef (src/core/params.h) has a default member initializer on
    ; `secret`, which only makes a type an aggregate from C++14 on; under
    ; gnu++11 every ParamDef brace-initializer in the tree (e.g.
    ; device_params.cpp) fails to compile. Match the standard the rest of the
    ; codebase is written against rather than hunting for a C++11-safe subset.
    ; The framework appends its own -std=gnu++11 after build_flags, and the
    ; last -std wins on the command line, so build_unflags below is required
    ; too -- -std alone in build_flags is silently overridden.
    -std=gnu++17
    -Wswitch
    -Iinclude
    -D FW_TARGET_ARDUINO=1
    -D FW_MCU_ESP32=1
    -D BOARD_HEADER='"boards/esp32_wroom32.h"'
build_unflags =
    -std=gnu++11
monitor_speed = 115200          ; must match FW_SERIAL_BAUD in include/config.h
; Without this, editing a board header does NOT trigger a rebuild -- same
; reason the other two envs carry it, see the note on [env:blackpill_f411ce].
extra_scripts = pre:scripts/config_hash.py
lib_deps =
    bblanchon/ArduinoJson@^7.0.4
; No upload_protocol/debug_tool: esptool over the board's own USB-UART
; bridge is the espressif32 platform's default, and there is no ST-Link
; involved for this board at all.

[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu++17
    ; Same switch exhaustiveness guarantee as the board env, and it belongs
    ; here more: `pio test -e native` is the env everyone actually runs, so
    ; without this a new Op added with no case in Dispatcher::handle compiles
    ; clean and silently answers with a response missing "ok". -Werror=switch
    ; makes it a failure rather than a warning scrolled past in the log.
    -Wswitch
    -Werror=switch
    -I src
    -I include
    ; Deliberately the REAL board header, not a fake "native" one: the native
    ; suite asserts against test/golden/schema.json, and that fixture is only
    ; meaningful if it describes the parameter/telemetry set the actual device
    ; exposes. FW_TARGET_ARDUINO is left undefined, so modules.cpp registers
    ; every module's descriptor with a null driver.
    -D BOARD_HEADER='"boards/blackpill_f411ce.h"'
extra_scripts = pre:scripts/config_hash.py
lib_deps =
    bblanchon/ArduinoJson@^7.0.4
lib_compat_mode = off
test_build_src = yes
; An include-list, not an exclude-list: any future Arduino-only file stays out
; of the native build automatically, with no edit here. The entries are
; (1) the pure core, (2) the module wiring file, (3) every module's pure
; descriptor TU, and (4) pure protocol TUs split out of a descriptor that had
; grown two protocols' worth of framing -- the driver TUs (*_driver.cpp) are
; what get left behind.
build_src_filter =
    +<core/*>
    +<modules.cpp>
    +<features/*/*_params.cpp>
    +<hardware/*/*_params.cpp>
    +<features/*/proto_*.cpp>
    +<hardware/*/proto_*.cpp>
    ; esc_math.cpp holds pure functions shared by the esc0/esc1 modules, not a
    ; ModuleDesc -- it doesn't match the *_params.cpp pattern above, so it
    ; needs its own line to be part of the native build (and its own test,
    ; test_esc, which links against it).
    +<hardware/esc/esc_math.cpp>
