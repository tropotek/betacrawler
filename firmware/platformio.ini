[env:blackpill_f411ce]
platform = ststm32
board = blackpill_f411ce
framework = arduino
upload_protocol = stlink
debug_tool = stlink
build_flags =
    -DUSBCON
    -DUSBD_USE_CDC
    -Wswitch
    -Iinclude
    ; Gates the driver half of src/modules.cpp. Set explicitly rather than
    ; sniffing the Arduino core's own ARDUINO macro, so "does this build have
    ; hardware drivers?" is answered by one self-documenting flag.
    -D FW_TARGET_ARDUINO=1
    -D BOARD_HEADER='"boards/blackpill_f411ce.h"'
    ; A CRSF frame lands every 6.6ms at 150fps; the Arduino default of 64
    ; bytes holds ~2 frames. 256 is the core's hard cap and holds ~66ms --
    ; still less than the 87ms a display refresh has been measured to take, so
    ; frames WILL be dropped during one. The parser resyncs and the rx `err`
    ; field counts it; this raises the bar rather than removing it.
    -D SERIAL_RX_BUFFER_SIZE=256
monitor_speed = 115200          ; must match FW_SERIAL_BAUD in include/config.h
; Without this, editing a board header does NOT trigger a rebuild -- see the
; docstring in scripts/config_hash.py. Do not remove it.
extra_scripts = pre:scripts/config_hash.py
lib_deps =
    bblanchon/ArduinoJson@^7.0.4
    ; Board-only: the native env compiles no *_driver.cpp, so it never needs
    ; a graphics library. FEATURE_ST7789_240X240 0 leaves it unused but harmless.
    moononournation/GFX Library for Arduino@^1.4.9

