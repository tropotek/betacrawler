          <div class="d-flex justify-content-between flex-wrap align-items-center pt-3 pb-2 mb-3 border-bottom">
            <h1 class="h2">Configuration</h1>
          </div>
          <div class="card mb-3" x-data>
            <div class="card-header h6 text-secondary mb-0 py-2">System</div>
            <div class="card-body row g-3">
              <template x-for="key in ['clk', 'ram', 'temp', 'vdd', 'loop', 'loopworst', 'up']
                                 .filter((k) => $store.telemetry.field(k).def)" :key="key">
                <div class="col-6 col-md-4">
                  <div class="text-secondary small" x-text="tlmLabel(key)"></div>
                  <div class="fs-4" x-text="$store.telemetry.field(key).value ?? '–'"></div>
                </div>
              </template>
              <template x-if="$store.telemetry.field('fault').def">
                <div class="col-6 col-md-4">
                  <div class="text-secondary small"
                       x-text="$store.telemetry.field('fault').def.label"></div>
                  <div class="fs-4"
                       :class="faultIsError($store.telemetry.field('fault').value) ? 'text-danger' : ''"
                       x-text="faultText($store.telemetry.field('fault').value)"></div>
                </div>
              </template>
            </div>
          </div>
          <template x-if="$store.telemetry.field('vbat').def">
            <div class="card mb-3" x-data>
              <div class="card-header h6 text-secondary mb-0 py-2">Battery</div>
              <div class="card-body row g-3">
                <div class="col-6 col-md-3">
                  <div class="text-secondary small">Pack (V)</div>
                  <div class="fs-4" x-text="$store.telemetry.field('vbat').value ?? '–'"></div>
                </div>
                <div class="col-6 col-md-3">
                  <div class="text-secondary small">Per cell (V)</div>
                  <div class="fs-4" x-text="perCellText()"></div>
                </div>
                <template x-if="$store.telemetry.field('pct').def">
                  <div class="col-6 col-md-3">
                    <div class="text-secondary small" x-text="tlmLabel('pct')"></div>
                    <div class="fs-4" x-text="$store.telemetry.field('pct').value ?? '–'"></div>
                  </div>
                </template>
                <template x-if="$store.telemetry.field('cells').def">
                  <div class="col-6 col-md-3">
                    <div class="text-secondary small" x-text="tlmLabel('cells')"></div>
                    <div class="fs-4" x-text="$store.telemetry.field('cells').value ?? '–'"></div>
                  </div>
                </template>
              </div>
            </div>
          </template>
          <fieldset class="card mb-3" :disabled="!$store.app.connected" x-data>
            <legend class="card-header h6 text-secondary mb-0 py-2">Identity</legend>
            <div class="card-body row g-3">
              <div class="col-md-6">
                <label class="form-label" for="f-device-name">Device Name</label>
                <input type="text" class="form-control" id="f-device-name"
                       :maxlength="$store.config.field('device.name').def?.maxlen"
                       :class="{ 'is-invalid': $store.config.invalid['device.name'] }"
                       x-model="$store.config.values['device.name']"
                       @change="$store.config.commit($store.config.field('device.name').def)">
              </div>
              <div class="col-md-6">
                <label class="form-label" for="f-tlm-rate">UI Telemetry Rate (Hz)</label>
                <input type="number" class="form-control" id="f-tlm-rate"
                       :min="$store.config.field('tlm.rate').def?.min" :max="$store.config.field('tlm.rate').def?.max"
                       :class="{ 'is-invalid': $store.config.invalid['tlm.rate'] }"
                       x-model="$store.config.values['tlm.rate']"
                       @change="$store.config.commit($store.config.field('tlm.rate').def)">
              </div>
            </div>
          </fieldset>
          <template x-if="$store.config.field('esc0.rate').def">
            <fieldset class="card mb-3" :disabled="!$store.app.connected" x-data>
              <legend class="card-header h6 text-secondary mb-0 py-2">ESC</legend>
              <div class="card-body row g-3">
                <div class="col-md-6">
                  <label class="form-label" for="f-esc-rate">PWM Rate (Hz)</label>
                  <select class="form-select" id="f-esc-rate"
                          :class="{ 'is-invalid': $store.config.invalid['esc0.rate'] || $store.config.invalid['esc1.rate'] }"
                          @change="$store.config.setBothEscRates($event.target.value)">
                    <template x-for="opt in $store.config.field('esc0.rate').def?.options ?? []" :key="opt">
                      <option :value="opt" :selected="opt === $store.config.values['esc0.rate']" x-text="opt"></option>
                    </template>
                  </select>
                  <div class="form-text">
                    How often each ESC is sent a new command. 50 Hz is what every analog ESC
                    auto-detects; a BLHeli_S-class ESC handles 400 Hz and cuts up to 20ms of
                    stick-to-motor delay. Changing this re-runs the arm hold.
                  </div>
                </div>
              </div>
            </fieldset>
          </template>
          <template x-if="$store.config.field('vbat.source').def">
            <fieldset class="card mb-3" :disabled="!$store.app.connected" x-data="{ measured: '' }">
              <legend class="card-header h6 text-secondary mb-0 py-2">Battery Sensor</legend>
              <div class="card-body row g-3">
                <div class="col-md-6">
                  <label class="form-label" for="f-vbat-cells">Cells</label>
                  <select class="form-select" id="f-vbat-cells"
                          :class="{ 'is-invalid': $store.config.invalid['vbat.cells'] }"
                          x-model="$store.config.values['vbat.cells']"
                          @change="$store.config.commit($store.config.field('vbat.cells').def)">
                    <template x-for="opt in $store.config.field('vbat.cells').def?.options ?? []" :key="opt">
                      <option :value="opt" x-text="opt"></option>
                    </template>
                  </select>
                  <div class="form-text">
                    <strong>auto</strong> latches the count from the first valid reading and
                    never revisits it. It cannot tell a part-drained 6S from a 5S, so set the
                    count explicitly if the Cells reading above is wrong.
                  </div>
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="f-vbat-measured">Measured pack voltage (V)</label>
                  <div class="input-group">
                    <input type="number" step="0.01" class="form-control" id="f-vbat-measured"
                           x-model="measured" placeholder="e.g. 16.78">
                    <button class="btn btn-outline-secondary" type="button"
                            @click="$store.config.calibrateVbat(measured)">Calibrate</button>
                  </div>
                  <div class="form-text">
                    Read the pack with a multimeter, enter it here, and the reading is
                    adjusted to match. Needs Source set to adc.
                    <span class="d-block mt-1">
                      Scale <span class="font-monospace" x-text="$store.config.values['vbat.scale']"></span>
                      &mdash; set by calibrating, not edited directly.
                    </span>
                  </div>
                </div>
              </div>
            </fieldset>
          </template>
          <p>&nbsp;</p>
