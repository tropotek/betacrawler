site_name: betacrawler
site_description: Build and tune a radio-controlled vehicle — skid-steer or car — with a browser-based configurator.
site_url: https://tropotek.github.io/betacrawler/
repo_url: https://github.com/tropotek/betacrawler
repo_name: tropotek/betacrawler
docs_dir: docs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.indexes
    - navigation.top
    - search.suggest
    - content.code.copy

nav:
  - Home: index.md
  - Open the configurator: https://tropotek.github.io/betacrawler/app/
  - Build:
      - Choose your build: build/index.md
      - Skid steer:
          - build/skid/index.md
          - Brushed motors: build/skid/brushed.md
          - Brushless motors: build/skid/brushless.md
      - Car:
          - build/car/index.md
          - Brushed motors: build/car/brushed.md
          - Brushless motors: build/car/brushless.md
      - Flashing the firmware: build/flashing.md
      - Chassis examples: build/chassis-examples.md
  - Add-ons:
      - addons/index.md
      - Battery sense: addons/battery-sense.md
  - Drive it:
      - Connect to the board: drive/install-and-connect.md
      - First setup: drive/first-setup.md
      - Tuning: drive/tuning.md
  - Reference:
      - Parameters: reference/parameters.md
      - Arming and modes: reference/arming-and-modes.md
      - Status LED: reference/status-led.md
      - Terminal and backup: reference/terminal-and-backup.md
  - Troubleshooting: troubleshooting.md
  - Development:
      - Setup: development/setup.md
      - Contributing: development/contributing.md
      - Releasing: development/releasing.md
      - Architecture: development/architecture.md
      - Protocol: development/protocol.md

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path: docs
      check_paths: true

# Snippet fragments included into the build pages. Excluded from the site so
# they are neither published at a bare URL nor reported as missing from the nav.
exclude_docs: |
  _shared/

validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
