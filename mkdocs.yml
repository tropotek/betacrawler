site_name: betacrawler
site_description: Build and tune a radio-controlled tracked vehicle with a browser-based configurator.
site_url: https://tropotek.github.io/betacrawler/
repo_url: https://github.com/tropotek/betacrawler
repo_name: tropotek/betacrawler
docs_dir: docs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy

nav:
  - Home: index.md
  - Build:
      - What you need: build/what-you-need.md
      - Wiring: build/wiring.md
      - Flashing the firmware: build/flashing.md
  - Drive it:
      - Install and connect: drive/install-and-connect.md
      - First setup: drive/first-setup.md
      - Tuning: drive/tuning.md

markdown_extensions:
  - admonition
  - tables
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
